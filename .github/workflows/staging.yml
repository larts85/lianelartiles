name: Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

env:
  WORKER_NAME: lianel
  WORKERS_SUBDOMAIN: artiles
  STAGING_ALIAS: staging

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload staging version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.78.0
          command: versions upload --preview-alias ${{ env.STAGING_ALIAS }}

      - name: Publish staging summary
        run: |
          echo "Staging URL: https://${STAGING_ALIAS}-${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev" >> "$GITHUB_STEP_SUMMARY"
